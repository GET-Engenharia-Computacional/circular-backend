name: Backend checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: localiza_test
      JWT_SECRET: integration-secret-with-at-least-32-characters
      ALLOW_INTEGRATION_DB_RESET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start native MySQL
        run: |
          sudo systemctl start mysql
          MYSQL_PWD=root mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE localiza_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
